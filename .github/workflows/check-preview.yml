name: Verify browser preview

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public game URL to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check character, sound and destruction in Chrome
        env:
          GAME_URL: ${{ inputs.url }}
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: game-preview-screenshots
          path: /tmp/game-preview*.png
