name: Verify browser preview

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public game URL to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix /tmp/browser playwright
      - name: Check real browser interactions
        env:
          GAME_URL: ${{ inputs.url }}
        shell: bash
        run: |
          cat > /tmp/browser/check.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader']});
          const page=await browser.newPage({viewport:{width:1280,height:800}}),errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          const response=await page.goto(process.env.GAME_URL,{timeout:60000});
          assert.equal(response.status(),200);
          await page.waitForFunction(()=>window.demolitionState?.().blocks===155,{timeout:30000});
          await page.screenshot({path:'/tmp/game-preview.png'});
          await page.mouse.click(920,550);
          assert.equal((await page.evaluate(()=>window.demolitionState())).blocks,156);
          await page.locator('[data-tool="blaster"]').click();
          await page.mouse.click(640,400);
          assert.ok((await page.evaluate(()=>window.demolitionState())).destroyed>0);
          await page.locator('[data-tool="nuke"]').click();
          await page.mouse.click(640,400);
          assert.equal((await page.evaluate(()=>window.demolitionState())).blocks,0);
          await page.locator('#reset').click();
          assert.equal((await page.evaluate(()=>window.demolitionState())).blocks,155);
          assert.deepEqual(errors,[]);
          console.log('Public browser check passed: rendering, construction, blaster, nuclear destruction, reset.');
          await browser.close();
          JS
          node /tmp/browser/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: game-preview-screenshot
          path: /tmp/game-preview.png
